[project]
name = "construction-bid-ai"
version = "0.1.0"
description = "Construction Bid AI Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "loguru>=0.7.2",
    "pymupdf>=1.23.0",
    "python-multipart>=0.0.6",
    "openai>=1.12.0",
    "tenacity>=8.2.0",
    "pyyaml>=6.0",
    "rq>=1.15.0",
    "redis>=5.0.0",
    "playwright>=1.40.0",
    "openpyxl>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pytest>=7.4.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
markers = [
    "golden: Golden tests that require fixture PDFs",
    "integration: Integration tests that run full pipeline",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "loguru.*",
    "pymupdf.*",
    "openai.*",
    "tenacity.*",
]
ignore_missing_imports = true

